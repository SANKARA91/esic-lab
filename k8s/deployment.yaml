apiVersion: apps/v1
kind: Deployment
metadata:
  name: esic-app
  labels:
    app: esic-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: esic-app
  template:
    metadata:
      labels:
        app: esic-app
    spec:
      containers:
      - name: esic-app
        image: esiclabacr.azurecr.io/esic-app:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"